spring.application.name=nyc-trees

# Render (and most PaaS hosts) assign a dynamic port via $PORT; fall back to
# 8080 for local dev where no such env var is set.
server.port=${PORT:8080}

# Global cap on stored tree interactions (in-memory demo store), protecting
# low-tier hosts from unbounded memory growth. Override via
# APP_INTERACTIONS_MAX_TOTAL env var if a larger/smaller limit is needed.
app.interactions.max-total=1000

# Per-client-IP rate limit applied to POST write endpoints. Override via
# APP_RATE_LIMIT_CAPACITY / APP_RATE_LIMIT_REFILL_PERIOD_SECONDS env vars.
app.rate-limit.capacity=20
app.rate-limit.refill-period-seconds=60

# Origins allowed to call the API via CORS. Override via APP_CORS_ALLOWED_ORIGINS
# (comma-separated) with the deployed frontend domain(s) in production.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
